name: YM Phase 6 connected correlation and linked cancellation controls
on:
  push:
    branches:
      - research/ym-phase6-connected-correlations-20261117
    paths:
      - 'research/ym-mass-gap-20261117/phase6/**'
      - '.github/workflows/ym-phase6-controls.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connected-correlation-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Checkout exact research revision
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/ym-mass-gap-20261117/phase6/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r research/ym-mass-gap-20261117/phase6/requirements.txt
      - name: Verify exact Phase 5 reproduction and complete second-order cancellation
        working-directory: research/ym-mass-gap-20261117/phase6
        run: python -m unittest -v test_phase6
