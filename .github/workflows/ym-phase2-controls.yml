name: YM phase 2 connected two-plaquette controls
on:
  push:
    branches:
      - research/ym-phase2-connected-two-plaquette-20261117
    paths:
      - 'research/ym-mass-gap-20261117/two-plaquette*'
      - 'research/ym-mass-gap-20261117/CONNECTED_TWO_PLAQUETTE_AUDIT.md'
      - '.github/workflows/ym-phase2-controls.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connected-gauge-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the exact research commit
        uses: actions/checkout@v4
      - name: Install pinned Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Run Phase 2 connected gauge and regression controls
        run: |
          node --test research/ym-mass-gap-20261117/two-plaquette.test.mjs research/ym-mass-gap-20261117/gap-benchmark.test.mjs research/ym-mass-gap-20261117/plaquette-certificate.test.mjs research/ym-mass-gap-20261117/volume-leakage.test.mjs
