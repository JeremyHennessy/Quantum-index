name: YM Phase 4 three-plaquette energy-weighted research controls
on:
  push:
    branches:
      - research/ym-phase4-energy-weighted-three-plaquette-20261117
    paths:
      - 'research/ym-mass-gap-20261117/phase4/**'
      - '.github/workflows/ym-phase4-controls.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  three-plaquette-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Checkout exact research branch commit
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/ym-mass-gap-20261117/phase4/requirements.txt
      - name: Install pinned numerical and SU2 symbolic tooling
        run: python -m pip install -r research/ym-mass-gap-20261117/phase4/requirements.txt
      - name: Execute independent Haar, CG, exact rational, and falsification controls
        working-directory: research/ym-mass-gap-20261117/phase4
        run: python -m unittest -v test_phase4_three_plaquette
