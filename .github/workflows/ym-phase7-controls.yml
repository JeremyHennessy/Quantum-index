name: YM Phase 7 exact fourth-order linked locality controls
on:
  push:
    branches:
      - research/ym-phase7-exact-fourth-order-locality-20261118
    paths:
      - 'research/ym-mass-gap-20261117/phase7/**'
      - '.github/workflows/ym-phase7-controls.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linked-cluster-proof-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Check out exact Phase 7 commit
        uses: actions/checkout@v4
      - name: Pin Python and dependency cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/ym-mass-gap-20261117/phase7/requirements.txt
      - name: Install pinned math dependencies
        run: python -m pip install -r research/ym-mass-gap-20261117/phase7/requirements.txt
      - name: Recheck unchanged Phase 6 proof controls
        working-directory: research/ym-mass-gap-20261117/phase6
        run: python -m unittest -v test_phase6
      - name: Validate Phase 7 exact support, Haar-center and cutoff falsifiers
        working-directory: research/ym-mass-gap-20261117/phase7
        run: python -m unittest -v test_phase7
