name: YM proof lab (isolated research branch)

on:
  push:
    branches:
      - research/ym-mass-gap-preflight-20261117
    paths:
      - 'research/ym-mass-gap-20261117/**'
      - '.github/workflows/ym-proof-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-toy-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pinned research branch
        uses: actions/checkout@v4
      - name: Generate pinned Lake dependency manifest
        working-directory: research/ym-mass-gap-20261117/lean
        shell: bash
        run: |
          set -euo pipefail
          tempdir="$(mktemp -d)"
          trap 'rm -rf "$tempdir"' EXIT
          curl -fsSL https://github.com/leanprover/elan/releases/download/v4.2.2/elan-x86_64-unknown-linux-gnu.tar.gz -o "$tempdir/elan.tar.gz"
          tar -xzf "$tempdir/elan.tar.gz" -C "$tempdir"
          "$tempdir/elan-init" -y --default-toolchain none --no-modify-path
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          test -s lake-manifest.json
      - name: Compile Lean 4 mathematical toy controls and audit axioms
        uses: leanprover/lean-action@v1
        env:
          LEAN_NUM_THREADS: '1'
        with:
          lake-package-directory: research/ym-mass-gap-20261117/lean
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: true
          axiom-audit: true
          axiom-audit-root: YMGapToy

  model-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact research commit
        uses: actions/checkout@v4
      - name: Run isolated mathematical regression and counterexample tests
        run: |
          node --test research/ym-mass-gap-20261117/gap-benchmark.test.mjs research/ym-mass-gap-20261117/plaquette-certificate.test.mjs
