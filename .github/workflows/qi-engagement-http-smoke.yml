name: Verify Quantum Index published HTML

on:
  push:
    branches:
      - diagnostic/qi-engagement-http-20261027

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public GitHub Pages release without generating synthetic visits
        shell: bash
        run: |
          set -euo pipefail
          URL='https://quantumindex.site/?qi_release=228cd84230d0eaef8325dad4a94dc81ad8cf5a27'
          curl --fail-with-body --silent --show-error --location --max-time 25 -H 'Cache-Control: no-cache' "$URL" > /tmp/qi-production.html
          grep -Fq 'id="qi-engagement-tracker"' /tmp/qi-production.html
          grep -Fq 'qi-engagement-collector.jeremy-hennessy-c4e.workers.dev/event' /tmp/qi-production.html
          grep -Fq 'Additional route analytics record section and public theory openings' /tmp/qi-production.html
          echo 'Public index.html includes the route tracker, endpoint, and privacy disclosure'
          ACTUAL="$(sha256sum /tmp/qi-production.html | cut -d' ' -f1)"
          EXPECTED='cb44a2d65a2fb3eddb21bc11fc3b1fabcd2399d2a101790a8bd0c8c9e7890f75'
          echo "Expected release HTML SHA256: $EXPECTED"
          echo "Published release HTML SHA256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          echo 'Published HTML exactly matches the reviewed repository release artifact'
