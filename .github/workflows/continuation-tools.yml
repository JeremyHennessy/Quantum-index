name: Regenerate corrected multidomain depth artifacts
on:
  push:
    branches: [agent/continuation-tools-20261007]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/multidomain-depth-20261008
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pin candidate and predecessor
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b206a92fd8115849b9a9960f10e846f78b2c7914
          test "$(git rev-parse origin/main)" = 483d507225c2632a995c9c6317cb0f690c20d920
      - name: Regenerate derived outputs only
        run: |
          set -euo pipefail
          node scripts/coverage-report.mjs
          node scripts/freshness-report.mjs
          node scripts/version-assets.mjs
          node scripts/coverage-report.mjs --check
          node scripts/freshness-report.mjs --check
          node scripts/version-assets.mjs --check
      - name: Commit generated outputs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/COVERAGE.md docs/FORMULA_AUDIT.md docs/FORMULA_COVERAGE.md docs/RELATION_PROVENANCE.md docs/RESEARCH_PROFILES.md docs/coverage.json docs/FRESHNESS.md docs/freshness.json index.html docs/responsive-check.html
          git diff --cached --check
          if git diff --cached --quiet; then echo "No generated changes"; exit 0; fi
          git commit -m 'Regenerate corrected multidomain depth derived artifacts'
          git push origin HEAD:refs/heads/agent/multidomain-depth-20261008
