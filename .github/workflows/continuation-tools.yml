name: Export preserved continuation review
on:
  push:
    branches: [agent/continuation-tools-20261007]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export pinned repository and original follow-up
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = cbe65b1f30216565fd93aea838264a4f9838bc6c
          test "$(git rev-parse origin/agent/reconciled-scientific-release-20261007)" = 349ef716d8c272852af687ab81aeae59c203d641
          if git config --local --get-regexp 'http\..*extraheader'; then exit 1; fi
          npm ci --ignore-scripts
          tar -czf "$RUNNER_TEMP/qi-continuation-snapshot.tgz" --exclude='./.git/hooks' .
          sha256sum "$RUNNER_TEMP/qi-continuation-snapshot.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: qi-continuation-snapshot-20261007b
          path: ${{ runner.temp }}/qi-continuation-snapshot.tgz
          retention-days: 3
