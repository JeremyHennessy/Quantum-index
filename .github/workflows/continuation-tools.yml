name: Export pinned Bell review baseline
on:
  push:
    branches: [agent/continuation-tools-20261007]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export exact verified main without credentials
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = 4034edd3bd3f631c67b12255193d203beff234df
          if git config --local --get-regexp 'http\..*extraheader'; then exit 1; fi
          git checkout --detach origin/main
          npm ci --ignore-scripts
          tar -czf "$RUNNER_TEMP/qi-bell-baseline.tgz" --exclude='./.git/hooks' .
          sha256sum "$RUNNER_TEMP/qi-bell-baseline.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: qi-bell-baseline-snapshot
          path: ${{ runner.temp }}/qi-bell-baseline.tgz
          retention-days: 3
