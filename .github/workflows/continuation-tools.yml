name: Diagnose four-Passport historical bytes
on:
  push:
    branches: [agent/continuation-tools-20261007]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: science/four-passports-20261013
          fetch-depth: 0
      - name: Compare current prefix, baseline commit and audited relation release
        shell: bash
        run: |
          set -euo pipefail
          echo "CURRENT"; sha256sum theories.js; git hash-object theories.js
          python3 - <<'PY'
          from pathlib import Path
          b=Path('theories.js').read_bytes()
          marker=b'// 2026-10-13 modern QED notation source.'
          at=b.index(marker)
          prefix=b[:at]
          import subprocess,hashlib
          print("marker offset",at,"prefix tail",repr(prefix[-8:]))
          for n in range(5):
            x=prefix[:-n] if n else prefix
            p=subprocess.run(['git','hash-object','--stdin'],input=x,stdout=subprocess.PIPE,check=True)
            print("trim",n,"len",len(x),"git",p.stdout.decode().strip(),"sha256",hashlib.sha256(x).hexdigest())
          PY
          echo "BASE d2a9"; git show d2a9f204cdd664b2751669aea0d229fc3188b79e:theories.js | sha256sum; git show d2a9f204cdd664b2751669aea0d229fc3188b79e:theories.js | git hash-object --stdin
          echo "PR74 e152"; git show e1520a6c4b09cd425629825038dd0e190878024d:theories.js | sha256sum; git show e1520a6c4b09cd425629825038dd0e190878024d:theories.js | git hash-object --stdin
          echo "Ledger"; grep -A5 '"fileTransition"' docs/RELATION_PROMOTIONS_2026-10-08.json
