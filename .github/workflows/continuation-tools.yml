name: Verify recovered Compare and Zeno release
on:
  push:
    branches: [agent/continuation-tools-20261007]
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover and verify original patch
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/agent/reconciled-scientific-release-20261007)" = 349ef716d8c272852af687ab81aeae59c203d641
          test -z "$(git ls-remote --heads origin refs/heads/agent/passport-compare-zeno-20261007)"
          python3 - <<'PY'
          import pathlib,base64,lzma,hashlib,os
          payload=lzma.decompress(base64.b64decode(pathlib.Path('.continuation/followup.b64').read_text(),validate=True))
          assert hashlib.sha256(payload).hexdigest()=='434c3e447640b0e95a7d8c383ed50431e7367b72afdefa2927eee9937f56cd29'
          pathlib.Path(os.environ['RUNNER_TEMP'],'followup.patch').write_bytes(payload)
          PY
      - name: Assemble app-only follow-up and verify exact tree
        id: candidate
        run: |
          set -euo pipefail
          git checkout --detach 349ef716d8c272852af687ab81aeae59c203d641
          git apply --unidiff-zero --index --exclude=.github/workflows/validate.yml "$RUNNER_TEMP/followup.patch"
          python3 - <<'PY'
          from pathlib import Path
          import json
          r=Path.cwd()
          p=r/'docs/COMPARE_ZENO_2026-10-07.json';j=json.loads(p.read_text())
          for k in ['previousFiles','updatedFiles']:j[k].pop('.github/workflows/validate.yml',None)
          j['runnerChange']['status']='Deferred; not included in this release. The original assembly was rejected because its GitHub Actions token lacked workflows permission. Tests use an isolated matching official Playwright image, leaving the production workflow and Pages settings unchanged.'
          p.write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n')
          p=r/'scripts/compare-zeno.test.mjs';s=p.read_text().replace("['app.js','.github/workflows/validate.yml']","['app.js']");p.write_text(s)
          p=r/'docs/RELEASE_COMPARE_ZENO_2026-10-07.md';s=p.read_text().replace('new formula and narrow browser-runner repair','new formula')
          s=s[:s.index('## Browser runner repair')]+'''## Separate infrastructure issue

          Run `37665870604` timed out fetching Ubuntu package indexes before any browser test ran. A mirror change bundled in the original follow-up could not be pushed by its workflow token. That infrastructure proposal is excluded from this app release, not worked around by changing token permissions. The original proposal remains in the tooling branch audit trail. Independent browser verification uses the matching official Playwright image; the shipped workflow, test requirements and Pages settings remain unchanged.
          '''
          p.write_text(s)
          p=r/'tests/browser/reconciliation.spec.mjs';s=p.read_text().replace("  const path=testInfo.outputPath(`cq-formulas-${width}.png`);", "  await page.locator('#formulaGrid').evaluate(el=>el.scrollIntoView({block:'start'}));\n  const path=testInfo.outputPath(`cq-formulas-${width}.png`);");p.write_text(s)
          PY
          git add docs/COMPARE_ZENO_2026-10-07.json scripts/compare-zeno.test.mjs docs/RELEASE_COMPARE_ZENO_2026-10-07.md tests/browser/reconciliation.spec.mjs
          git diff --cached --check
          test "$(git write-tree)" = 8e289ef17de97bf2b0b32549bca87216dfac7c97
          test -z "$(git diff --cached --name-only -- .github styles.css workspace.js profiles.js passports.js package.json package-lock.json)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Extend Passport comparisons and curate the deferred Zeno representative'
          git push origin HEAD:refs/heads/agent/passport-compare-zeno-20261007
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.assemble.outputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate exact app tree
        run: |
          test "$(git rev-parse HEAD^{tree})" = 8e289ef17de97bf2b0b32549bca87216dfac7c97
          npm ci --ignore-scripts
          npm test
          npm run validate
          mkdir -p verification
          git rev-parse HEAD > verification/tested-commit.txt
          git rev-parse HEAD^{tree} > verification/tested-tree.txt
      - name: Run full unmodified assertions in pinned official browsers
        run: |
          set -euo pipefail
          IMAGE=mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
          timeout 180 docker pull "$IMAGE"
          printf "import config from './playwright.config.mjs';\nexport default {...config,webServer:undefined};\n" > .independent-playwright.config.mjs
          python3 -m http.server 4173 --bind 127.0.0.1 > verification/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for n in $(seq 1 20); do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          timeout 480 docker run --rm --ipc=host --network=host -e CI=true -v "$PWD:/work" -w /work "$IMAGE" npx playwright test --config=.independent-playwright.config.mjs
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-compare-zeno-verification
          path: |
            verification/
            playwright-report/
            test-results/
          retention-days: 7
