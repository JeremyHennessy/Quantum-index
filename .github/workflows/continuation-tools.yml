name: Independently verify exact PR69 browsers
on:
  push:
    branches: [agent/continuation-tools-20261007]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a1bbbad32684084a3fba057606d3903a7639c34a
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify exact candidate and install locked JS dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a1bbbad32684084a3fba057606d3903a7639c34a
          test "$(git rev-parse origin/main)" = 483d507225c2632a995c9c6317cb0f690c20d920
          test "$(node -p "require('./package.json').devDependencies['@playwright/test']")" = "1.63.0"
          npm ci --ignore-scripts
          mkdir -p verification
          git rev-parse HEAD > verification/tested-commit.txt
          git rev-parse HEAD^{tree} > verification/tested-tree.txt
      - name: Run unchanged complete browser suite in pinned official image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE=mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
          timeout 180 docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' > verification/browser-image.json
          printf "import config from './playwright.config.mjs';\nexport default {...config,webServer:undefined};\n" > .independent-playwright.config.mjs
          python3 -m http.server 4173 --bind 127.0.0.1 > verification/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for n in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          timeout 600 docker run --rm --ipc=host --network=host -e CI=true -v "$PWD:/work" -w /work "$IMAGE" npx playwright test --config=.independent-playwright.config.mjs
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr69-exact-browser-verification
          path: |
            verification/
            playwright-report/
            test-results/
          retention-days: 14
