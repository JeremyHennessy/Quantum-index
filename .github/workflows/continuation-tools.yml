name: Assemble and verify bounded lattice curation
on:
  push:
    branches: [agent/continuation-tools-20261007]
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check preserved baseline and reviewed patch
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = 462f2d96649f3c030c06fe35b537d3fd1599d90a
          test -z "$(git ls-remote --heads origin refs/heads/agent/lattice-depth-20261007)"
          python3 - <<'PY'
          import pathlib,base64,lzma,hashlib,os
          encoded=''.join(pathlib.Path(f'.continuation/lattice-{i}.b64').read_text().strip() for i in range(3))
          payload=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(payload).hexdigest()=='bb14376524be66a407280b55a9a2883b2544bc03dfedbe0a3f6317098c7e72b0'
          pathlib.Path(os.environ['RUNNER_TEMP'],'lattice.patch').write_bytes(payload)
          PY
      - name: Reproduce reviewed app-only tree without changing main
        id: candidate
        run: |
          set -euo pipefail
          git checkout --detach 462f2d96649f3c030c06fe35b537d3fd1599d90a
          git apply --unidiff-zero --index --check "$RUNNER_TEMP/lattice.patch"
          git apply --unidiff-zero --index "$RUNNER_TEMP/lattice.patch"
          git diff --cached --check
          test "$(git write-tree)" = c0ea8a4cea143fc1c485d28ddf64437f29b2b3b3
          test -z "$(git diff --cached --name-only -- .github styles.css workspace.js profiles.js package.json package-lock.json developments.js questions.js problems.js evidence.js formula-audit.js)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Curate lattice model formulas and three source-scoped Theory Passports'
          git push origin HEAD:refs/heads/agent/lattice-depth-20261007
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'Candidate `%s`\n\nTree `%s`\n\nMain and Pages unchanged.\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" >> "$GITHUB_STEP_SUMMARY"
  verify:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.assemble.outputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact tree and full Node and data assertions
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = c0ea8a4cea143fc1c485d28ddf64437f29b2b3b3
          mkdir -p verification
          git rev-parse HEAD > verification/tested-commit.txt
          git rev-parse HEAD^{tree} > verification/tested-tree.txt
          npm ci --ignore-scripts
          npm test 2>&1 | tee verification/node-tests.log
          npm run validate 2>&1 | tee verification/data-validation.log
          node scripts/coverage-report.mjs --check
          node scripts/freshness-report.mjs --check
          node scripts/version-assets.mjs --check
      - name: Run complete Chromium and WebKit tests in matching pinned browsers
        run: |
          set -euo pipefail
          IMAGE=mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
          timeout 180 docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' > verification/browser-image.json
          printf "import config from './playwright.config.mjs';\nexport default {...config,webServer:undefined};\n" > .independent-playwright.config.mjs
          python3 -m http.server 4173 --bind 127.0.0.1 > verification/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for n in $(seq 1 20); do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          timeout 540 docker run --rm --ipc=host --network=host -e CI=true -v "$PWD:/work" -w /work "$IMAGE" npx playwright test --config=.independent-playwright.config.mjs
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lattice-curation-verification
          path: |
            verification/
            playwright-report/
            test-results/
          retention-days: 14
