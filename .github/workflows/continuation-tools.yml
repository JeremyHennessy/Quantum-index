name: Verify deployed Quantum Index release
on:
  push:
    branches: [agent/continuation-tools-20261007]
permissions:
  contents: read
jobs:
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 462f2d96649f3c030c06fe35b537d3fd1599d90a
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare read-only hosted verification
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = 8e289ef17de97bf2b0b32549bca87216dfac7c97
          npm ci --ignore-scripts
          mkdir -p verification
          cat > .hosted-check.mjs <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {chromium,webkit,devices,request,expect} from '@playwright/test';
          const base='https://jeremyhennessy.github.io/Quantum-index/';
          const out='verification';fs.mkdirSync(out,{recursive:true});
          const report={startedAt:new Date().toISOString(),expectedCommit:process.env.EXPECTED_COMMIT,base,assets:[],browsers:[],scope:'Live hosted bytes and fresh isolated browser contexts; no edits to user research or backend data.'};
          const opened=[];
          const sha=b=>createHash('sha256').update(b).digest('hex');
          try {
           const api=await request.newContext();opened.push(api);
           const localHTML=fs.readFileSync('index.html');
           const paths=['index.html',...Array.from(localHTML.toString().matchAll(/(?:src|href)="\.\/([^"?]+)\?v=([a-f0-9]+)"/g),m=>m[1]+'?v='+m[2])];
           for(const p of paths){const response=await api.get(base+p,{timeout:60000});assert(response.ok(),`HTTP ${response.status()} ${p}`);const bytes=await response.body(),local=fs.readFileSync(p.split('?')[0]);assert.equal(sha(bytes),sha(local),`Hosted bytes differ for ${p}`);report.assets.push({path:p,status:response.status(),sha256:sha(bytes)});}
           await api.dispose();
           for(const [name,engine,opts] of [['chromium',chromium,{viewport:{width:1280,height:900}}],['webkit',webkit,devices['iPhone 13']]]){
            const browser=await engine.launch({headless:true});opened.push(browser);const context=await browser.newContext(opts);const page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(e.message));
            const result={name,routes:[],screenshots:[]};report.browsers.push(result);
            const go=async route=>{const r=await page.goto(base+route,{waitUntil:'networkidle',timeout:60000});assert(!r || r.ok(),`HTTP route ${route}`);await page.waitForFunction(()=>window.QI_DATA?.theories?.length===481);result.routes.push(route);};
            await go('#/explore');await expect(page.locator('.hero h2')).toHaveText('Explore the ideas shaping modern physics.');
            assert.deepEqual(await page.evaluate(()=>({theories:QI_DATA.theories.length,formulas:QI_FORMULAS.formulas.length,sources:QI_DATA.sources.length,evidence:QI_EVIDENCE.records.length})),{theories:481,formulas:393,sources:537,evidence:13});
            await go('#/compare?ids=hawking-radiation,wimp-dark-matter,aqft');const table=page.locator('#comparisonResults');await expect(table.locator('table')).toHaveCount(1);await expect(table).toContainText('Fundamental objects / degrees of freedom');await expect(page.locator('#compareSlot2')).toHaveValue('aqft');
            await table.locator('details summary').first().click();await expect(table.locator('details').first()).toHaveAttribute('open','');await table.evaluate(el=>el.scrollIntoView({block:'start'}));
            const shot=out+`/hosted-compare-${name}.png`;await page.screenshot({path:shot});result.screenshots.push(shot);
            result.comparisonScroll=await table.locator('.comparison-scroll').evaluate(el=>{el.scrollLeft=el.scrollWidth;const r={client:el.clientWidth,content:el.scrollWidth,atEnd:Math.abs(el.scrollLeft+el.clientWidth-el.scrollWidth)<=2};el.scrollLeft=0;return r;});
            assert(result.comparisonScroll.content<=result.comparisonScroll.client+2 || result.comparisonScroll.atEnd,'Comparison columns must be reachable by horizontal scrolling');
            await table.locator('thead a').first().click();await expect(page.locator('#theoryDetail .passport')).toBeVisible();await page.locator('#backToView').click();await expect(page.locator('#compareSlot2')).toHaveValue('aqft');
            await go('#/formula?theory=quantum-zeno');await expect(page.locator('#formulaGrid .formula-card')).toHaveCount(1);await expect(page.locator('#formulaGrid')).toContainText('N consecutive survival outcomes');await expect(page.locator('#formulaGrid mjx-container').first()).toBeVisible({timeout:30000});
            await page.locator('#formulaGrid').evaluate(el=>el.scrollIntoView({block:'start'}));const zshot=out+`/hosted-zeno-${name}.png`;await page.screenshot({path:zshot});result.screenshots.push(zshot);
            result.formulaScroll=await page.locator('#formulaGrid .formula-equation mjx-container').evaluate(el=>{el.scrollLeft=el.scrollWidth;return {client:el.clientWidth,content:el.scrollWidth,atEnd:Math.abs(el.scrollLeft+el.clientWidth-el.scrollWidth)<=2};});
            assert(result.formulaScroll.content<=result.formulaScroll.client+2 || result.formulaScroll.atEnd,'Full equation must be reachable by horizontal scrolling');
            result.math=await page.evaluate(async()=>{await MathJax.startup.promise;const failures=[];for(const f of QI_FORMULAS.formulas){try{const node=await MathJax.tex2svgPromise(f.latex,{display:true});if(node.querySelector('[data-mml-node="merror"],mjx-merror'))failures.push(f.id);}catch(e){failures.push(f.id+': '+e.message);}}return {total:QI_FORMULAS.formulas.length,failures,tradeoff:QI_FORMULAS.formulas.find(f=>f.id==='cq-decoherence-diffusion-tradeoff').latex};});
            assert.equal(result.math.total,393);assert.deepEqual(result.math.failures,[]);assert.equal(result.math.tradeoff,String.raw`4D_2\succeq D_0^{-1}`);
            await go('#/problems?problem=quantum-gravity');await expect(page.locator('#problemDetail')).toContainText('geodesic');await expect(page.locator('#problemDetail')).toContainText('Diósi');
            await go('#/theory/configuration-ensemble-cq');await expect(page.locator('#theoryDetail')).toContainText('Configuration-ensemble');
            await go('#/catalog?search=Planck');await page.locator('#catalog a[href*="planck-quanta"]').click();await page.locator('#backToView').click();await expect(page.locator('#search')).toHaveValue('Planck');
            await go('#/theory/wave-mechanics');await page.locator('#researchNote').fill('Isolated deployment smoke test — no user browser data.');await page.locator('#saveNote').click();await expect(page.locator('#researchStatus')).toContainText('Note saved');await page.reload();await expect(page.locator('#researchNote')).toHaveValue('Isolated deployment smoke test — no user browser data.');result.isolatedNoteRoundTrip=true;
            await go('#/coverage');await expect(page.locator('#coverageView')).toContainText('Nuclear quantum theory');await page.setViewportSize({width:320,height:900});assert(await page.locator('html').evaluate(el=>el.scrollWidth<=el.clientWidth),'320px overflow');
            assert.deepEqual(errors,[]);result.pageErrors=errors;result.passed=true;await context.close();await browser.close();
           }
           report.passed=true;
          } catch(e){report.passed=false;report.error=e.stack;process.exitCode=1;}
          finally{await Promise.allSettled(opened.map(x=>typeof x.dispose==='function'?x.dispose():x.close()));report.completedAt=new Date().toISOString();fs.writeFileSync(out+'/hosted-receipt.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report,null,2));}
          JS
          node --check .hosted-check.mjs
      - name: Verify final deployed bytes and isolated desktop/mobile sessions
        run: |
          set -euo pipefail
          IMAGE=mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
          timeout 180 docker pull "$IMAGE"
          timeout 420 docker run --rm --ipc=host -e EXPECTED_COMMIT=462f2d96649f3c030c06fe35b537d3fd1599d90a -v "$PWD:/work" -w /work "$IMAGE" node .hosted-check.mjs
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quantum-index-hosted-release-verification
          path: verification/
          retention-days: 14
