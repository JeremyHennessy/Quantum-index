name: Independently verify multidomain depth candidate
on:
  push:
    branches: [agent/continuation-tools-20261007]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1077631ba3f4cebfc66901ea7a6e467e665461da
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify exact candidate identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1077631ba3f4cebfc66901ea7a6e467e665461da
          test "$(git rev-parse HEAD^{tree})" = 1acd93a914d65cc91a72d2340dc98ed450bd02ac
          test "$(git rev-parse HEAD~13)" || true
          mkdir -p verification
          git rev-parse HEAD > verification/tested-commit.txt
          git rev-parse HEAD^{tree} > verification/tested-tree.txt
      - name: Run full Node data and generated-artifact checks
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm test 2>&1 | tee verification/node-tests.log
          npm run validate 2>&1 | tee verification/data-validation.log
      - name: Run complete Chromium and WebKit suite in pinned official image
        run: |
          set -euo pipefail
          IMAGE=mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
          timeout 180 docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' > verification/browser-image.json
          printf "import config from './playwright.config.mjs';\nexport default {...config,webServer:undefined};\n" > .independent-playwright.config.mjs
          python3 -m http.server 4173 --bind 127.0.0.1 > verification/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for n in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          timeout 720 docker run --rm --ipc=host --network=host -e CI=true -v "$PWD:/work" -w /work "$IMAGE" npx playwright test --config=.independent-playwright.config.mjs
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multidomain-depth-exact-verification
          path: |
            verification/
            playwright-report/
            test-results/
          retention-days: 14
