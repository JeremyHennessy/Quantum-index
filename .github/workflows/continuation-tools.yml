name: Independent pinned browser verification
on:
  push:
    branches: [agent/continuation-tools-20261007]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 349ef716d8c272852af687ab81aeae59c203d641
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact candidate and install its locked test dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 349ef716d8c272852af687ab81aeae59c203d641
          test "$(git rev-parse HEAD^{tree})" = 983ffa1dc0eecb4d9fad4960c8b431932c20f7b7
          npm ci --ignore-scripts
          node -e "if(require('./package.json').devDependencies['@playwright/test']!=='1.63.0')process.exit(1)"
      - name: Pull matching official preinstalled browser environment
        run: |
          timeout 180 docker pull mcr.microsoft.com/playwright:v1.63.0-noble
          mkdir -p verification
          docker image inspect mcr.microsoft.com/playwright:v1.63.0-noble --format '{{json .RepoDigests}}' > verification/browser-image.json
          printf '%s\n' '349ef716d8c272852af687ab81aeae59c203d641' > verification/tested-commit.txt
      - name: Run unchanged complete browser suite against the original Python static server
        shell: bash
        run: |
          set -euo pipefail
          printf "import config from './playwright.config.mjs';\nexport default {...config,webServer:undefined};\n" > .independent-playwright.config.mjs
          python3 -m http.server 4173 --bind 127.0.0.1 > verification/static-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for n in $(seq 1 20); do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          timeout 540 docker run --rm --ipc=host --network=host -e CI=true -v "$PWD:/work" -w /work mcr.microsoft.com/playwright:v1.63.0-noble npx playwright test --config=.independent-playwright.config.mjs
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate62-browser-verification
          path: |
            verification/
            playwright-report/
            test-results/
          retention-days: 7
