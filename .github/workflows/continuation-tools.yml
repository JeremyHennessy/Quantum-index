name: Export pinned post-lattice snapshot
on:
  push:
    branches: [agent/continuation-tools-20261007]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export verified main without credentials
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = 197aa15c57d2a43d098f43a21f6ec0514f349bba
          if git config --local --get-regexp 'http\..*extraheader'; then exit 1; fi
          git checkout --detach origin/main
          npm ci --ignore-scripts
          tar -czf "$RUNNER_TEMP/qi-post-lattice.tgz" --exclude='./.git/hooks' .
          sha256sum "$RUNNER_TEMP/qi-post-lattice.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: qi-post-lattice-working-snapshot
          path: ${{ runner.temp }}/qi-post-lattice.tgz
          retention-days: 3
