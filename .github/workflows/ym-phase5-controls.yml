name: YM Phase 5 local resolvent and four plaquette controls
on:
  push:
    branches:
      - research/ym-phase5-local-resolvent-four-plaquette-20261117
    paths:
      - 'research/ym-mass-gap-20261117/phase5/**'
      - '.github/workflows/ym-phase5-controls.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-local-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Check out exact research commit
        uses: actions/checkout@v4
      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/ym-mass-gap-20261117/phase5/requirements.txt
      - name: Install exact numerical and SU2 symbolic dependencies
        run: python -m pip install -r research/ym-mass-gap-20261117/phase5/requirements.txt
      - name: Independently test Gauss law, Haar, recoupling and distant-loop falsifier
        working-directory: research/ym-mass-gap-20261117/phase5
        run: python -m unittest -v test_phase5_local
